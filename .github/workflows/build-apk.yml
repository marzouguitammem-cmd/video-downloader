name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      # Repeats the compiler errors as annotations, readable without opening the full log.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A4 build.log | grep -v "^--$" | head -80 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          split -l 8 errors.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error::${msg}"
          done

      - name: Collect APKs
        run: |
          ls -la app/build/outputs/apk/release/
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk   out/video-downloader-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/video-downloader-arm32.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: video-downloader-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: محمّل الفيديو 1.0.${{ github.run_number }}
          body: |
            حمّل **video-downloader-arm64.apk** (يخدم على أغلب التليفونات).
            إذا قلّك «التطبيق غير متوافق»، حمّل **video-downloader-arm32.apk**.
          files: out/*.apk
          make_latest: true
