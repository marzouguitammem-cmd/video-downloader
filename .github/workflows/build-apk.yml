name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        run: |
          ls -la app/build/outputs/apk/release/
          mkdir -p out
          cp app/build/outputs/apk/release/app-universal-release.apk   out/video-downloader.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk   out/video-downloader-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/video-downloader-arm32.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: video-downloader-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: محمّل الفيديو 1.0.${{ github.run_number }}
          body: |
            حمّل **video-downloader-arm64.apk** (يخدم على أغلب التليفونات).
            إذا قلّك «التطبيق غير متوافق»، حمّل **video-downloader-arm32.apk**.
            **video-downloader.apk** يخدم على الزوز أما حجمو أكبر.
          files: out/*.apk
          make_latest: true
